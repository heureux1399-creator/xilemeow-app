    .login-box{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:24px; width:100%; max-width:320px; }
    .login-label{ font-size:10px; color:rgba(255,255,255,.5); letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; display:block; }
    .login-input{ width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:13px 15px; font-size:18px; font-family:monospace; color:#fff; text-align:center; letter-spacing:.2em; margin-bottom:14px; }

    .card{ background:var(--card); border-radius:12px; border:1px solid var(--border); margin-bottom:12px; overflow:hidden; }
    .card-head{ padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }

    .btn-chat{ background:var(--ok-l); color:var(--ok); border:none; width:28px; height:28px; border-radius:7px; padding:0; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; }

    .seg-btn.active-ok{ background:var(--ok-l); color:var(--ok); font-weight:700; box-shadow:0 1px 4px rgba(45,106,79,.12); border: 1px solid rgba(45,106,79,.15); }
    .seg-btn.active-err{ background:var(--err-l); color:var(--err); font-weight:700; box-shadow:0 1px 4px rgba(184,65,65,.12); border: 1px solid rgba(184,65,65,.15); }

    .client-bal.pos{ color:var(--ok); }

    .cal-admin-slot{ font-size:9px; padding:1px 4px; border-radius:3px; margin-top:2px; text-align:center; font-weight:700; }
    .cal-admin-slot.open{ background:var(--ok-l); color:var(--ok); }
    .cal-admin-slot.closed{ color:var(--ink-3); }
    .cal-admin-today{ background:rgba(212,98,42,.06); border-color:rgba(212,98,42,.25); }
    .cal-admin-holiday .cal-admin-day{ color:var(--err); }
    .cal-admin-past .cal-admin-cell-inner{ opacity:.6; }
    .cal-slot-past{ background:rgba(150,150,150,.1); color:#aaa; }

    .tab-btn{ flex:1; padding:11px 8px; font-size:12px; font-weight:700; font-family:'Noto Sans TC',sans-serif; border:none; background:transparent; color:var(--ink-3); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
    .tab-btn.active{ color:var(--indigo); border-bottom-color:var(--indigo); }

    .info-table{ background:var(--bg); border-radius:8px; overflow:hidden; margin-bottom:14px; }
    .info-row{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 13px; border-bottom:1px solid var(--border); gap:10px; }
    .info-row:last-child{ border-bottom:none; }

    .fin-hero-label{ font-size:11px; color:rgba(255,255,255,.6); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
    .fin-hero-val{ font-size:32px; font-weight:700; font-family:monospace; color:#fff; line-height:1.2; }
    .fin-hero-unit{ font-size:14px; color:rgba(255,255,255,.6); margin-left:4px; font-weight:400; }
    
    .fin-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .fin-sub-card{ background:var(--card); border-radius:10px; padding:14px 16px; border:1px solid var(--border); }

<body>
<div id="app" v-cloak>

  <!-- 登入畫面 -->
  <div v-if="!isAuthenticated" class="login-screen">
    <div class="login-logo">洗咧喵</div>
    <div class="login-sub">後台管理系統</div>
    <div class="login-box">
      <label class="login-label">管理密碼</label>
      <input type="password" v-model="passwordInput" @keyup.enter="verifyPassword" class="login-input" placeholder="••••••">
      <button class="login-btn" @click="verifyPassword" :disabled="loading">{{ loading ? '驗證中...' : '進入後台' }}</button>
    </div>
  </div>

  <!-- Toast -->
  <transition name="fade">
    <div v-if="toast.show" :class="['toast', toast.isError?'err':'ok']">{{ toast.message }}</div>
  </transition>

  <!-- Confirm Modal -->
  <div v-if="confirmModal.show" class="modal-bg" @click.self="confirmModal.show=false">
    <div class="modal-box">
      <div class="modal-title">{{ confirmModal.title }}</div>
      <div class="modal-msg">{{ confirmModal.message }}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" style="flex:1;" @click="confirmModal.show=false">取消</button>
        <button class="btn btn-danger" style="flex:1;" @click="executeConfirmAction">確認</button>
      </div>
    </div>
  </div>

  <template v-if="isAuthenticated">

    <!-- Header -->
    <header class="app-header">
      <div style="font-family:monospace;font-size:10px;color:rgba(255,255,255,.4);margin-bottom:12px;letter-spacing:.04em;">
        v260724.05 · ADMIN · {{ activeTab }}
      </div>
      <div class="header-top">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="header-brand">洗咧喵</span>
          <!-- ⚡ 頂部非阻塞 Sync Pill -->
          <span v-if="loading" class="sync-pill">

          <div class="card card-accent-indigo">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

            </div>
          </div>
          <!-- 總儲值 / 總消費 摘要 -->
          <div class="fin-grid-2" style="margin-bottom:12px;">
            <div class="fin-sub-card">
              <div class="fin-sub-label">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                累積儲值
              </div>
              <div class="fin-sub-val val-pos">{{ t2Loaded ? '+' + (t2Profile.info.totalTopup||0) : '──' }}</div>
            </div>
            <div class="fin-sub-card">
              <div class="fin-sub-label">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>

          <div class="card">
            <div class="card-head">
              <div class="card-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                交易明細
              </div>
              <button class="btn-link" @click="recalc" :disabled="loading">{{ loading ? '計算中…' : '重算餘額' }}</button>
            </div>
            <div v-if="t2Profile.logs.length===0" class="empty"><div class="empty-title">無明細</div></div>

                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card" style="border:1px solid rgba(184,65,65,.2);border-left:3px solid var(--err);">
            <div class="card-body">
              <div style="font-size:12px;font-weight:700;color:var(--err);margin-bottom:4px;">刪除客戶資料</div>
              <div style="font-size:11px;color:var(--ink-2);margin-bottom:12px;">永久刪除此客戶所有資料，操作無法復原。</div>
              <button class="btn btn-danger btn-sm" @click="delClient" :disabled="loading">{{ loading ? '刪除中...' : '刪除此客戶' }}</button>
            </div>
          </div>
        </div>

      <!-- ════ TAB：行程管理 ════ -->
      <!-- ════ TAB3：行程管理 ════ -->
      <div v-if="activeTab==='tab-schedule'">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"/></svg>

                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                  {{ r.notes }}

                <div v-if="r.merchantNote" style="font-size:11px;color:var(--indigo-l);margin-top:2px;display:flex;align-items:center;gap:4px;">

            </div>

            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

            <span class="nav-label">收支</span>

        </div>

  </template>
</div>
<script>
  // ══════════════════════════════════════════════════════
  // 🔧 維護資料（每次更新請修改這裡）
  // ══════════════════════════════════════════════════════
  const ADMIN_VERSION    = 'v260724.05';                    // 版本號
  const LINE_OA_URL      = 'https://manager.line.biz/account/%40605isdpd/chat'; // LINE OA Manager（💬 按鈕連結）
  const STORAGE_KEY      = 'jemin_admin_pwd';               // localStorage 密碼金鑰（改密碼時一起改）
  // ══════════════════════════════════════════════════════
  const { createApp, ref, onMounted, computed } = Vue;
  createApp({
    setup() {
      const loading = ref(false), isAuthenticated = ref(false), passwordInput = ref(''), activeTab = ref('tab-schedule');
      
      // ⚡ 核心優化：狀態標記變數（預設為 false，避免呈現假數字或 0）
      const hasLoadedClients = ref(false);
      const hasLoadedBookings = ref(false);
      const hasLoadedSchedules = ref(false);

      const clientsList = ref([]);
      const bookingRequests = ref([]);
      const confirmedSchedules = ref([]);

      // ⚡ 計算屬性：沒載入完成前一律顯示 ──
      const clientCountDisplay = computed(() => hasLoadedClients.value ? clientsList.value.length : '──');
      const pendingCountDisplay = computed(() => hasLoadedBookings.value ? bookingRequests.value.length : '──');
      const scheduleCountDisplay = computed(() => hasLoadedSchedules.value ? confirmedSchedules.value.length : '──');

      const toast = ref({ show:false, message:'' });
      const showToast = (m) => { toast.value.message=m; toast.value.show=true; setTimeout(()=>toast.value.show=false, 3000); };
      const confirmModal = ref({ show:false, title:'', message:'', onConfirm:null });
      const triggerConfirm = (t,m,fn,label) => { confirmModal.value={ show:true, title:t, message:m, onConfirm:fn, confirmLabel:label||'確認' }; };
      const executeConfirmAction = () => { if(confirmModal.value.onConfirm) confirmModal.value.onConfirm(); confirmModal.value.show=false; };
      const pwd = () => passwordInput.value;

      // ⚡ 靜默抓取待確認件數
      const fetchPendingBookings = () => {
        if (!isAuthenticated.value) return;
        google.script.run
          .withSuccessHandler((res)=>{
            bookingRequests.value = (res && res.list) ? res.list : [];
            hasLoadedBookings.value = true;
          })
          .withFailureHandler(()=>{ hasLoadedBookings.value = true; }) // 失敗也停止轉圈
          .adminGetBookings(pwd());
      };

      // ⚡ 靜默抓取今後排程筆數
      const fetchConfirmedSchedules = () => {
        if (!isAuthenticated.value) return;
        google.script.run
          .withSuccessHandler((res)=>{
            confirmedSchedules.value = (res && res.list) ? res.list : [];
            hasLoadedSchedules.value = true;
          })
          .withFailureHandler(()=>{ hasLoadedSchedules.value = true; }) // 失敗也停止轉圈
          .adminGetSchedules(pwd());
      };

      // ⚡ 靜默抓取客戶名冊與客戶數
      const refreshClients = () => {
        google.script.run.withSuccessHandler((res)=>{ 
          clientsList.value = (res && res.list) ? res.list : []; 
          hasLoadedClients.value = true;
        }).adminGetClients(pwd());
      };

      // 登入成功邏輯：一次平行發起所有核心背景載入
      const fetchCal = (forceRefresh) => {
        // 有快取且不強制重整 → 直接渲染，不轉圈
        if(scheduleMapCache && !forceRefresh) {
          renderCal(null, scheduleMapCache);
          return;
        }
        calLoading.value = true;
        calGrid.value = [];
        google.script.run
          .withSuccessHandler((res)=>{
            calLoading.value=false;
            if(res){
              scheduleMapCache = res.scheduleMap; // 存快取
              renderCal(res.slots, res.scheduleMap);
            }
          })
          .withFailureHandler(()=>{ calLoading.value=false; showToast('月曆載入失敗', true); })
          .adminGetCalendar(calYear.value, calMonth.value, pwd());
      };

      const verifyPassword = () => {
        const p = passwordInput.value.trim(); if(!p) return;
        loading.value = true;
        google.script.run.withSuccessHandler((res)=>{
          loading.value = false;
          if(res && res.success){ 
            isAuthenticated.value = true; 
            localStorage.setItem('jemin_admin_pwd', p); 
            showToast('🔑 驗證成功！'); 
            
            // 🚀 一開機全速背景載入
            refreshClients(); 
            fetchPendingBookings();
            fetchConfirmedSchedules();
            loadFinance();
            loadContent();
            // 單獨載入時段範本（不依賴 loadScheduleTab）
            google.script.run
              .withSuccessHandler((r)=>{ if(r&&r.success&&r.slots&&r.slots.length>0) customSlots.value=r.slots; })
              .adminGetSlots(p);
            loadAdvanceDays();
            loadApptMonths();
            // 立刻觸發月曆載入
            loadHolidayData();
            fetchCal();
          }
          else { showToast('❌ 密碼錯誤！'); localStorage.removeItem('jemin_admin_pwd'); }
        }).withFailureHandler((e)=>{ loading.value=false; showToast('連線失敗：'+e); }).adminVerifyPwd({ pwd: p });
      };
      const logout = () => { localStorage.removeItem('jemin_admin_pwd'); location.reload(); };

      const switchTab = (t) => {
        if(loading.value) { showToast('⏳ 請等待目前操作完成'); return; }
        activeTab.value = t;
        if(t==='tab-clients') refreshClients();
        else if(t==='tab-schedule'){ loadScheduleTab(); if(!hasLoadedContent.value) loadContent(); }
        else if(t==='tab-finance') loadFinance();
      };

      // TAB1
      const t1SelectUid=ref(''), t1CustomUid=ref(''), t1Type=ref('minus'), t1Amount=ref(''), t1Desc=ref('');
      const submitT1Bound = () => {
        // 從目前開啟的客戶詳情頁取 UID，直接綁定不需選人
        const uid = t2SelectUid.value;
        if(!uid){ showToast('❌ 請先進入客戶檔案', true); return; }
        let amt = parseFloat(t1Amount.value);
        const desc = t1Desc.value.trim();
        if(isNaN(amt) || amt <= 0 || !desc){ showToast('❌ 請填寫金額與說明', true); return; }
        const finalAmt = t1Type.value==='minus' ? -Math.abs(amt) : Math.abs(amt);
        loading.value = true;
        google.script.run
          .withSuccessHandler((r)=>{
            loading.value = false;
            if(r && r.success){
              showToast('✅ 交易已登錄');
              t1Amount.value = '';
              t1Desc.value = '';
              // 重新載入該客戶的明細和累積數字
              loadClient();
              refreshClients();
            } else showToast('❌ 登錄失敗', true);
          })
          .withFailureHandler(()=>{ loading.value=false; showToast('❌ 連線失敗', true); })
          .adminAddTransaction(uid, finalAmt, desc, pwd());
      };
      const submitT1 = () => {
        const uid = t1SelectUid.value || t1CustomUid.value.trim();
        let amt = parseFloat(t1Amount.value); const desc = t1Desc.value.trim();
        if(!uid || isNaN(amt) || amt<0 || !desc){ showToast('❌ 欄位未完整'); return; }
        const finalAmt = t1Type.value==='minus' ? -Math.abs(amt) : Math.abs(amt);
        loading.value = true;
        google.script.run.withSuccessHandler((res)=>{ loading.value=false; showToast(res && res.success ? `✅ 完成！餘額 ${res.newBalance}` : '失敗'); t1Amount.value=''; t1Desc.value=''; refreshClients(); }).adminAddTransaction(uid, finalAmt, desc, pwd());
      };

      // TAB2
      const t2SelectUid=ref(''), t2SearchQuery=ref(''), t2Profile=ref({ info:{}, cats:[], logs:[] });
          const t2Loaded = ref(false);
      const clientName = (uid) => {
        if(!uid || uid==='未指定') return '未指定';
        const c = clientsList.value.find(c=>c.uid===uid);
        return c ? c.name : uid;
      };
      const clientLineUid = (uid) => {
        if(!uid || uid==='未指定') return '';
        const c = clientsList.value.find(c=>c.uid===uid);
        return c ? c.lineUid : '';
      };
      const filteredClients = computed(()=>{ if(!t2SearchQuery.value.trim()) return clientsList.value; const q=t2SearchQuery.value.toLowerCase().trim(); return clientsList.value.filter(c=>c.uid.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)); });
      const openClient = (uid) => { t2SelectUid.value=uid; loadClient(); };
      const goToFlow = (uid) => {
        // 跳到家長頁該客戶的金流登記區塊
        if(!uid || uid==='未指定') { showToast('此筆無指定客戶', true); return; }
        switchTab('tab-clients');
        t2SelectUid.value = uid;
        loadClient();
        // 等畫面渲染後 scroll 到金流登記
        setTimeout(() => {
          const el = document.getElementById('flow-anchor');
          if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
        }, 500);
      };
      const loadClient = () => { if(!t2SelectUid.value) return; loading.value=true; t2Loaded.value=false; google.script.run.withSuccessHandler((res)=>{ loading.value=false; if(res && res.success){ t2Profile.value=res; t2Loaded.value=true; } }).adminGetProfile(t2SelectUid.value, pwd()); };
      const saveNote = () => { loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('備註已儲存'); }).adminUpdateNote(t2SelectUid.value, t2Profile.value.info.note, pwd()); };
      const recalc = () => { loading.value=true; google.script.run.withSuccessHandler((r)=>{ loading.value=false; showToast('已重算餘額：'+ (r?r.newBalance:'')); loadClient(); refreshClients(); }).adminRecalc(t2SelectUid.value, pwd()); };
      const delLog = (log) => { triggerConfirm('⚠️ 刪除交易','刪除後會反向平衡餘額，確定？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已刪除'); refreshClients(); loadClient(); }).adminDeleteLog(log.rowIndex, t2SelectUid.value, log.amount, pwd()); }); };
      const delClient = () => { triggerConfirm('🚨 徹底註銷','將永久刪除此家長所有資料，不可逆！確定？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已註銷'); t2SelectUid.value=''; refreshClients(); }).adminDeleteClient(t2SelectUid.value, pwd()); }); };

      // TAB3
      const customSlots=ref([]), newSlot=ref('');
      const dragIdx=ref(-1), dragOverIdx=ref(-1);
      const dragStart = (idx) => { dragIdx.value=idx; };
      const dragOver  = (idx) => { dragOverIdx.value=idx; };
      const dragEnd   = () => {
        const from=dragIdx.value, to=dragOverIdx.value;
        if(from<0||to<0||from===to){ dragIdx.value=-1; dragOverIdx.value=-1; return; }
        const arr=[...customSlots.value];
        arr.splice(to, 0, arr.splice(from, 1)[0]);
        customSlots.value=arr;
        // 存新順序到後端
        google.script.run
          .withSuccessHandler((r)=>{ if(r&&r.success) showToast('順序已儲存'); })
          .adminSaveSlots(arr, pwd());
        dragIdx.value=-1; dragOverIdx.value=-1;
      };
      const scheduleView = ref('current');
      const todayStr = ref('');
      const scheduleHistory = ref([]);
      const historyLoading = ref(false);
      const historyStart = ref(''), historyEnd = ref(''), historyQuery = ref('');
      let historySearchTimer = null;

      const switchToHistory = () => { scheduleView.value = 'history'; loadHistory(); };
      const loadHistory = () => {
        historyLoading.value = true;
        google.script.run
          .withSuccessHandler((res)=>{ historyLoading.value=false; scheduleHistory.value = (res && res.list) ? res.list : []; })
          .withFailureHandler(()=>{ historyLoading.value=false; showToast('查詢失敗', true); })
          .adminGetScheduleHistory(historyStart.value, historyEnd.value, historyQuery.value, pwd());
      };
      const debounceHistorySearch = () => { clearTimeout(historySearchTimer); historySearchTimer = setTimeout(loadHistory, 400); };
      const exportHistoryCsv = () => {
        google.script.run.withSuccessHandler((res)=>{
          if (!res || !res.success) { showToast('匯出失敗', true); return; }
          const blob = new Blob(["\ufeff" + res.csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `排程紀錄_${historyStart.value}_${historyEnd.value}.csv`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); showToast('已匯出 CSV');
        }).adminExportScheduleHistoryCsv(historyStart.value, historyEnd.value, historyQuery.value, pwd());
      };
      const formTitle=ref('📝 行程表單'), formBtnText=ref('✦ 存入排程'), formDesc=ref('點擊左側帶入資料，或直接填寫新建行程');
      const clearForm = () => {
        formTitle.value='📝 新建行程'; formBtnText.value='✦ 存入排程'; formDesc.value='手動填寫，直接新增至排程';
        form.value={ originRowIndex:'0', editScheduleRowIndex:'0', uid:'', count:'1', address:'', date:'', time:'', customTime:'', catDetail:'', notes:'', merchantNote:'' };
        document.getElementById('form-anchor').scrollIntoView({behavior:'smooth', block:'center'});
      };
      const form=ref({ originRowIndex:'0', editScheduleRowIndex:'0', uid:'', count:'', address:'', date:'', time:'', catDetail:'', notes:'' });
      const batch=ref({ startDate:'', endDate:'', selectedSlots:[] });
      const advanceDays = ref(1);
      const apptMonths = ref(0); // 家長預約顯示月數，0=全部
      const loadAdvanceDays = () => {
        google.script.run
          .withSuccessHandler((r)=>{ if(r&&r.success) advanceDays.value=r.days; })
          .getAdvanceDays();
      };

        loading.value = true;
        google.script.run
          .withSuccessHandler((r)=>{ loading.value=false; if(r&&r.success) showToast('✅ 提前天數已儲存'); else showToast('❌ 儲存失敗', true); })
          .withFailureHandler(()=>{ loading.value=false; showToast('❌ 連線失敗', true); })
          .saveAdvanceDays(advanceDays.value, pwd());
      };
      const loadApptMonths = () => {
        google.script.run
          .withSuccessHandler((r)=>{ if(r&&r.success) apptMonths.value=r.months; })
          .getApptMonths();
      };
      const saveApptMonths = () => {
        loading.value = true;
        google.script.run
          .withSuccessHandler((r)=>{ loading.value=false; if(r&&r.success) showToast('✅ 顯示月數已儲存'); else showToast('❌ 儲存失敗', true); })
          .withFailureHandler(()=>{ loading.value=false; showToast('❌ 連線失敗', true); })
          .saveApptMonths(apptMonths.value, pwd());
      };
      const _now = new Date();
      const calYear=ref(_now.getFullYear()), calMonth=ref(_now.getMonth()+1);
      const calMonthTitle=ref(_now.getFullYear()+'年'+String(_now.getMonth()+1).padStart(2,'0')+'月');
      const calGrid=ref([]), calLoading=ref(false);
      let scheduleMapCache = null; // 月曆資料快取，null=尚未載入
      const _todayStr = _now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0')+'-'+String(_now.getDate()).padStart(2,'0');
      

      const loadScheduleTab = () => {
        loading.value = true;
        calLoading.value = true;
        calGrid.value = [];
        scheduleMapCache = null; // 清快取，確保重抓最新資料
        google.script.run.withSuccessHandler((res)=>{
          loading.value = false;
          if(res && res.success) {
            bookingRequests.value = res.bookings || [];
            hasLoadedBookings.value = true;
            confirmedSchedules.value = res.schedules || [];
            hasLoadedSchedules.value = true;
            // 時段範本：只在有值時才更新，避免空值蓋掉本地已有的
            if(res.slots && res.slots.length > 0) customSlots.value = res.slots;
            renderCal(res.calSlots, res.scheduleMap);
          }
          calLoading.value = false;
        }).withFailureHandler((e)=>{
          loading.value=false;
          calLoading.value=false;
          showToast('載入失敗：'+e, true);
        }).adminGetScheduleTabData(pwd(), calYear.value, calMonth.value);
      };
      const pickBooking = (idx) => {
        const r = bookingRequests.value[idx];
        formTitle.value='📝 審核預約單'; formBtnText.value='✦ 確認登錄排程'; formDesc.value='來自客人預約申請，可修改後登錄';
        form.value = { originRowIndex:String(r.rowIndex), editScheduleRowIndex:'0', uid:r.uid, count:String(r.count), address:r.address, date:r.date, time:r.time, catDetail:r.catDetail, notes:r.notes, merchantNote:r.merchantNote||'' };
        document.getElementById('form-anchor').scrollIntoView({behavior:'smooth', block:'center'});
      };
      const delBooking = (r) => { triggerConfirm('🗑️ 刪除預約','永久移除此預約申請？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已清除'); loadScheduleTab(); }).adminDeleteBooking(r.rowIndex, pwd()); }); };
      const pickSchedule = (idx) => {
        const s = confirmedSchedules.value[idx];
        formTitle.value='✏️ 修改行程'; formBtnText.value='💾 儲存變更'; formDesc.value='點擊帶入，直接修改後儲存';
        form.value = { originRowIndex:'0', editScheduleRowIndex:String(s.rowIndex), uid:s.uid, count:s.count, address:s.address, date:s.date, time:s.time, catDetail:s.catDetail, notes:s.notes, merchantNote:s.merchantNote||'' };
        document.getElementById('form-anchor').scrollIntoView({behavior:'smooth', block:'center'});
      };
      const pickHistoryItem = (h) => {
        formTitle.value='✏️ 修改歷史紀錄'; formBtnText.value='💾 儲存變更'; formDesc.value='點擊帶入，直接修改後儲存（含歷史紀錄）';
        form.value = { originRowIndex:'0', editScheduleRowIndex:String(h.rowIndex), uid:h.uid==='未指定'?'':h.uid, count:h.count, address:h.address, date:h.date, time:h.time, customTime:'', catDetail:h.catDetail, notes:h.notes, merchantNote:h.merchantNote||'' };
        document.getElementById('form-anchor').scrollIntoView({behavior:'smooth', block:'center'});
      };
      const commitSchedule = () => {
        const f = form.value;
        const finalTime = (f.time==='__custom__') ? f.customTime.trim() : f.time;
        if(!f.date || !finalTime){ showToast('❌ 請至少填寫日期與時辰'); return; }
        loading.value = true;
        google.script.run.withSuccessHandler(()=>{
          loading.value=false; showToast('✅ 排程已同步！');
          formTitle.value='📝 行程表單'; formBtnText.value='✦ 存入排程';
          formDesc.value='點擊左側帶入資料，或直接填寫新建行程';
          form.value={ originRowIndex:'0', editScheduleRowIndex:'0', uid:'', count:'1', address:'', date:'', time:'', customTime:'', catDetail:'', notes:'', merchantNote:'' };
          loadScheduleTab();
          if (scheduleView.value==='history') loadHistory();
        }).adminCommitSchedule({ pwd:pwd(), originRowIndex:f.originRowIndex, editScheduleRowIndex:f.editScheduleRowIndex, uid:f.uid||'未指定', count:f.count||'1', address:f.address, date:f.date, time:finalTime, catDetail:f.catDetail, notes:f.notes, merchantNote:f.merchantNote||'' });
      };
      const delSchedule = (s) => { triggerConfirm('⚠️ 取消行程','釋放此時段？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已取消'); loadScheduleTab(); if(scheduleView.value==='history') loadHistory(); }).adminDeleteSchedule(s.rowIndex, pwd()); },'確認取消'); };
      const delHistoryItem = (h) => { triggerConfirm('⚠️ 刪除歷史紀錄','此操作無法復原，確定刪除？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已刪除'); loadHistory(); }).adminDeleteSchedule(h.rowIndex, pwd()); }); };
      const addSlot = () => {
        const v=newSlot.value.trim(); if(!v) return;
        if(customSlots.value.includes(v)){ showToast('⚠️ 已存在此時段'); return; }
        const newSlots = [...customSlots.value, v];
        loading.value=true;
        google.script.run
          .withSuccessHandler((r)=>{ loading.value=false; if(r&&r.success){ customSlots.value=r.slots||newSlots; newSlot.value=''; showToast('✅ 時段已加入'); } else showToast('❌ 新增失敗',true); })
          .withFailureHandler(()=>{ loading.value=false; showToast('❌ 連線失敗',true); })
          .adminSaveSlots(newSlots, pwd());
      };
      const removeSlot = (idx) => {
        const s=customSlots.value[idx];
        triggerConfirm('刪除時段',`從範本庫移除「${s}」？過去已批次設定的記錄不受影響。`,()=>{
          loading.value=true;
          google.script.run
            .withSuccessHandler((r)=>{ loading.value=false; if(r&&r.success){ customSlots.value=r.slots||customSlots.value.filter((_,i)=>i!==idx); showToast('已移除'); } })
            .withFailureHandler(()=>{ loading.value=false; showToast('❌ 連線失敗',true); })
            .adminRemoveSlot(s, pwd());
        });
      };
      const toggleBatch = (s) => { const i=batch.value.selectedSlots.indexOf(s); if(i>=0) batch.value.selectedSlots.splice(i,1); else batch.value.selectedSlots.push(s); };
      const onBatchStartChange = () => { if(batch.value.startDate > batch.value.endDate) batch.value.endDate = batch.value.startDate; };
      const onBatchEndChange   = () => { if(batch.value.endDate < batch.value.startDate) batch.value.startDate = batch.value.endDate; };
      const doBatch = (mode) => {
        const b=batch.value; if(!b.startDate||!b.endDate||b.selectedSlots.length===0){ showToast('❌ 未完整'); return; }
        let arr=[], dt=new Date(b.startDate+'T00:00:00'), end=new Date(b.endDate+'T00:00:00');
        if(dt>end){ showToast('❌ 日期錯誤'); return; }
        while(dt<=end){ let y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(); arr.push(`${y}-${m<10?'0'+m:m}-${d<10?'0'+d:d}`); dt.setDate(dt.getDate()+1); }
        triggerConfirm('⚡ 批次調整',`將選取期間設為「${mode==='open'?'開放':'關閉'}」？`,()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('⚡ 完成！'); batch.value.selectedSlots=[]; scheduleMapCache=null; loadScheduleTab(); }).adminBatchSchedule(arr, b.selectedSlots, mode, pwd()); },'確認調整');
      };
      const moveMonth = (dir) => {
        calMonth.value += dir;
        if(calMonth.value>12){ calMonth.value=1; calYear.value++; }
        if(calMonth.value<1){ calMonth.value=12; calYear.value--; }
        calMonthTitle.value = calYear.value+'年'+(calMonth.value<10?'0'+calMonth.value:calMonth.value)+'月';
        fetchCal(); // 有快取就直接渲染，不重抓
      };


      // 台灣公定假日（格式 MM-DD，每年可更新）
      const twHolidays = new Set([
        '01-01','02-16','02-17','02-18','02-19','02-20','02-21','02-22',
        '04-03','04-04','04-05','05-01','06-19','09-28','10-10'
      ]);
      const isHoliday = (dateStr) => {
        const md = dateStr.substring(5); // yyyy-MM-DD → MM-DD
        return twHolidays.has(md);
      };
      const renderCal = (slots, scheduleMap) => {
        const grid=[]; const firstDay=new Date(calYear.value, calMonth.value-1, 1).getDay(); const total=new Date(calYear.value, calMonth.value, 0).getDate();
        for(let i=0;i<firstDay;i++) grid.push({empty:true});
        const todayStr = _todayStr; // 使用初始化時算好的今日字串
        for(let d=1;d<=total;d++){
          const fm=calMonth.value<10?'0'+calMonth.value:calMonth.value, fd=d<10?'0'+d:d;
          const dateStr=calYear.value+'-'+fm+'-'+fd;
          const isPast = dateStr < todayStr;
          const isToday = dateStr === todayStr;
          const holiday = isHoliday(dateStr);
          const weekDay = new Date(calYear.value, calMonth.value-1, d).getDay(); // 0=日 6=六
          const isSunday = weekDay === 0;
          const isSaturday = weekDay === 6;
          // ★ 從 scheduleMap 直接讀這天的實際時段，不依賴範本庫
          // 這樣過去的記錄不會因為範本庫改了而消失
          let dayData = scheduleMap ? (scheduleMap[dateStr] || {}) : {};
          let cells = [];
          const daySlots = Object.keys(dayData); // 這天實際有記錄的時段
          if(daySlots.length > 0){
            daySlots.forEach(s => {
              cells.push({ shortName:(s.split(' ')[0]||s), isOpen: dayData[s]==='開放', isPast });
            });
          }
          // holidays/workdays 優先判斷
          var md = fm+'-'+fd;
          var isHolidayMark = inHolidaySet(calYear.value, md, holidayData.value.holidays) || holiday;
          var isWorkday     = inHolidaySet(calYear.value, md, holidayData.value.workdays);
          grid.push({ empty:false, dayNum:d, dateStr, isToday, isPast, isHoliday:holiday, isHolidayMark, isWorkday, isSunday, isSaturday, slots:cells });
        }
        calGrid.value = grid;
      };

      // TAB4
      const financeStart=ref(''), financeEnd=ref('');
      // 文案公告板
      const contentList = ref([]);
      const contentSaving = ref(false);  // 文案操作專用 loading
      const holidayLoading = ref(false); // 更新假日專用 loading
      const holidayData = ref({ holidays:{}, workdays:{} }); // 從後端載入的假日資料

      // 判斷某日期（MM-DD）是否在指定年份的清單裡
      const inHolidaySet = (year, md, dict) => {
        var yStr = String(year);
        return dict && dict[yStr] && dict[yStr].indexOf(md) >= 0;
      };
      const hasLoadedContent = ref(false);
      const adminExpandedIds = ref([]);
      const toggleAdminContent = (id) => {
        const idx = adminExpandedIds.value.indexOf(id);
        if(idx >= 0) adminExpandedIds.value.splice(idx, 1);
        else adminExpandedIds.value.push(id);
      };
      const contentDragIdx = ref(-1), contentDragOverIdx = ref(-1);
      const contentDragStart = (idx) => { contentDragIdx.value = idx; };
      const contentDragOver  = (idx) => { contentDragOverIdx.value = idx; };
      const contentDragEnd   = () => {
        const from = contentDragIdx.value, to = contentDragOverIdx.value;
        if(from < 0 || to < 0 || from === to){ contentDragIdx.value=-1; contentDragOverIdx.value=-1; return; }
        // 重新排列清單
        const arr = [...contentList.value];
        arr.splice(to, 0, arr.splice(from, 1)[0]);
        // 更新每筆的 sort 值（依新順序 1,2,3...）
        arr.forEach((item, i) => { item.sort = i + 1; });
        contentList.value = arr;
        contentDragIdx.value = -1; contentDragOverIdx.value = -1;
        // 批次寫回 Sheet 的排序欄
        contentSaving.value = true;
        let done = 0;
        arr.forEach((item) => {
          google.script.run
            .withSuccessHandler(() => {
              done++;
              if(done === arr.length){ contentSaving.value = false; showToast('✅ 順序已儲存'); }
            })
            .withFailureHandler(() => { contentSaving.value = false; showToast('❌ 儲存失敗', true); })
            .adminSaveContent(item.rowIndex, item.key||'', item.title, item.body, item.sort, item.enabled, pwd());
        });
      };
      const contentForm = ref({ show:false, rowIndex:0, key:'', title:'', body:'', sort:99, enabled:true });

      const fetchHolidays = () => {
        holidayLoading.value = true;
        google.script.run
          .withSuccessHandler((r)=>{
            holidayLoading.value=false;
            if(r&&r.success){
              showToast('✅ '+r.message);
              // 重新載入月曆以套用新假日
              fetchCal();
            } else showToast('❌ 更新失敗', true);
          })
          .withFailureHandler(()=>{ holidayLoading.value=false; showToast('❌ 連線失敗', true); })
          .adminFetchHolidays(pwd());
      };
      // 從後端載入假日資料（登入後和更新後呼叫）
      const loadHolidayData = () => {
        google.script.run
          .withSuccessHandler((r)=>{
            if(r) {
              holidayData.value = r;
              // 假日資料載入後重新渲染月曆套用顏色
              if(calGrid.value.length > 0) fetchCal();
            }
          })
          .getHolidayList();
      };
      const loadContent = () => {
        hasLoadedContent.value = false;
        google.script.run
          .withSuccessHandler((r)=>{ if(r&&r.success){ contentList.value=r.list; } hasLoadedContent.value=true; })
          .withFailureHandler(()=>{ hasLoadedContent.value=true; showToast('文案載入失敗', true); })
          .adminGetContent(pwd());
      };
      const openNewContent = () => {
        contentForm.value = { show:true, rowIndex:0, key:'', title:'', body:'', sort:contentList.value.length+1, enabled:true };
      };
      const editContent = (item) => {
        contentForm.value = { show:true, rowIndex:item.rowIndex, key:item.key||'', title:item.title, body:item.body, sort:item.sort, enabled:item.enabled };
        // scroll 到表單
        setTimeout(()=>{ const el=document.querySelector('[placeholder="例如：儲值方案說明"]'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 100);
      };
      const saveContent = () => {
        const f = contentForm.value;
        if(!f.title.trim()){ showToast('❌ 請填寫標題', true); return; }
        contentSaving.value = true;
        google.script.run
          .withSuccessHandler((r)=>{ contentSaving.value=false; if(r&&r.success){ showToast('✅ 已儲存'); contentForm.value.show=false; loadContent(); } else showToast('❌ 儲存失敗', true); })
          .withFailureHandler(()=>{ contentSaving.value=false; showToast('❌ 連線失敗', true); })
          .adminSaveContent(f.rowIndex, f.key||'', f.title, f.body, f.sort, f.enabled, pwd());
      };
      const toggleContent = (item) => {
        contentSaving.value = true;
        google.script.run
          .withSuccessHandler((r)=>{ contentSaving.value=false; if(r&&r.success){ item.enabled=!item.enabled; showToast(item.enabled?'✅ 已啟用':'已停用'); } })
          .withFailureHandler(()=>{ contentSaving.value=false; showToast('❌ 更新失敗', true); })
          .adminSaveContent(item.rowIndex, item.key||'', item.title, item.body, item.sort, !item.enabled, pwd());
      };
      const deleteContent = (item) => {
        triggerConfirm('刪除文案', `確定刪除「${item.title}」？此操作無法復原。`, ()=>{
          contentSaving.value = true;
          google.script.run
            .withSuccessHandler((r)=>{ contentSaving.value=false; if(r&&r.success){ showToast('已刪除'); loadContent(); } else showToast('❌ 刪除失敗', true); })
            .withFailureHandler(()=>{ contentSaving.value=false; showToast('❌ 連線失敗', true); })
            .adminDeleteContent(item.rowIndex, pwd());
        });
      };
      // ⚡ 防呆優化：預設值設為 null，未載入時畫面顯示 ──，避免閃出 0 元
      const finance=ref({ totalBalance: null, recharge: null, consumption: null, income: null, expense: null, net: null, logs:[] });
      const shop=ref({ date:'', type:'minus', amount:'', desc:'' });
      const loadFinance = () => {
        if(!financeStart.value||!financeEnd.value) return;
        loading.value = true;
        google.script.run.withSuccessHandler((res)=>{
          loading.value = false;
          finance.value={ 
            totalBalance: res.totalMemberBalance||0, 
            recharge: res.memberRecharge||0,
            consumption: res.memberConsumption||0, 
            income: res.shopIncome||0, 
            expense: res.shopExpense||0, 
            net: res.netIncome||0, 
            logs: res.detailedLogs||[] 
          };
        }).withFailureHandler(()=>{ loading.value = false; }).adminGetFinance(financeStart.value, financeEnd.value, pwd());
      };
      const delFinanceLog = (log) => { triggerConfirm('⚠️ 刪除帳務','若為家長扣款會反向調平餘額，確定？',()=>{ loading.value=true; google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('已刪除'); loadFinance(); refreshClients(); }).adminDeleteLog(log.rowIndex, log.uid, log.amount, pwd()); }); };
      const submitShop = () => {
        const s=shop.value;
        if(!s.date || isNaN(parseFloat(s.amount)) || parseFloat(s.amount)<=0 || !s.desc){ showToast('❌ 未完整'); return; }
        const finalAmt = s.type==='minus' ? -Math.abs(s.amount) : Math.abs(s.amount);
        loading.value=true;
        google.script.run.withSuccessHandler(()=>{ loading.value=false; showToast('💰 記帳完成！'); shop.value.amount=''; shop.value.desc=''; loadFinance(); }).adminAddShopRecord(finalAmt, s.desc.trim(), s.date, pwd());
      };

      onMounted(()=>{
        window.addEventListener('beforeunload', function(e) { e.preventDefault(); e.returnValue = ''; });
        history.pushState(null, '', location.href);
        window.addEventListener('popstate', function() { if (loading.value && !confirm('操作進行中，確定要離開嗎？')) history.pushState(null, '', location.href); });
        
        setInterval(()=>{
          if(isAuthenticated.value && !loading.value) fetchPendingBookings();
        }, 30*1000);

        const t=new Date(), y=t.getFullYear(), m=t.getMonth()+1, d=t.getDate(), fm=m<10?'0'+m:m, fd=d<10?'0'+d:d;
        todayStr.value = `${y}-${fm}-${fd}`;
        financeStart.value=`${y}-${fm}-01`; financeEnd.value=`${y}-${fm}-${fd}`; shop.value.date=`${y}-${fm}-${fd}`;
        batch.value.startDate=`${y}-${fm}-${fd}`; batch.value.endDate=`${y}-${fm}-${fd}`;
        
        const past3m = new Date(t); past3m.setMonth(past3m.getMonth()-3);
        const py=past3m.getFullYear(), pm=past3m.getMonth()+1, pd=past3m.getDate();
        historyStart.value = `${py}-${pm<10?'0'+pm:pm}-${pd<10?'0'+pd:pd}`;
        historyEnd.value = todayStr.value;
        calYear.value=y; calMonth.value=m; calMonthTitle.value=`${y}年${fm}月`;
        const saved=localStorage.getItem('jemin_admin_pwd');
        if(saved){ passwordInput.value=saved; verifyPassword(); }
      });

      return { loading, isAuthenticated, passwordInput, activeTab, toast, clientsList, verifyPassword, logout, switchTab,
        confirmModal, executeConfirmAction,
        clientCountDisplay, pendingCountDisplay, scheduleCountDisplay,
        t1SelectUid, t1CustomUid, t1Type, t1Amount, t1Desc, submitT1, submitT1Bound,
        t2SelectUid, t2SearchQuery, filteredClients, openClient, t2Profile, t2Loaded, saveNote, recalc, delLog, delClient,
        bookingRequests, confirmedSchedules, hasLoadedBookings, hasLoadedSchedules, customSlots, newSlot, formTitle, formBtnText, formDesc, form, batch, calMonthTitle, calGrid, calLoading, clearForm, clientName,
        scheduleView, todayStr, scheduleHistory, historyLoading, historyStart, historyEnd, historyQuery, switchToHistory, loadHistory, debounceHistorySearch, exportHistoryCsv, delHistoryItem, pickHistoryItem,
        clientLineUid, goToFlow, pickBooking, delBooking, pickSchedule, commitSchedule, delSchedule, addSlot, removeSlot, dragIdx, dragOverIdx, dragStart, dragOver, dragEnd, onBatchStartChange, onBatchEndChange, advanceDays, saveAdvanceDays, apptMonths, saveApptMonths, toggleBatch, doBatch, moveMonth,
        contentList, hasLoadedContent, contentForm, contentSaving, holidayLoading, holidayData, loadHolidayData, adminExpandedIds, toggleAdminContent, contentDragIdx, contentDragOverIdx, contentDragStart, contentDragOver, contentDragEnd, openNewContent, editContent, saveContent, toggleContent, deleteContent, fetchHolidays,
        financeStart, financeEnd, finance, shop, loadFinance, delFinanceLog, submitShop };
    }
  }).mount('#app');
</script>
</body>
</html>
